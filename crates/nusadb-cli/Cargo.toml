[package]
name         = "nusadb-cli"
version      = { workspace = true }
edition      = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
rust-version = { workspace = true }
description  = "nusadb-cli — interactive SQL shell for NusaDB"
repository   = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "nusadb-cli"
path = "src/main.rs"

[dependencies]
nusadb-wire  = { workspace = true }
clap         = { workspace = true }
rustyline    = { workspace = true }
# `io-std` adds `tokio::io::stdin()`/`stdout()`, the streams a COPY reads from and writes to.
tokio        = { workspace = true, features = ["io-std"] }
tracing      = { workspace = true }
rustls       = { workspace = true }
tokio-rustls = { workspace = true }

[dev-dependencies]
nusadb-core = { workspace = true }
nusadb-btree = { workspace = true }
